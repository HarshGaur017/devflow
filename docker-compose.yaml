services:
  postgres:
    image: postgres:17
    container_name: devflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
      POSTGRES_DB: devflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow -d devflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - devflow-network

  redis:
    image: redis:8
    container_name: devflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - devflow-network

volumes:
  postgres_data:
  redis_data:

networks:
  devflow-network:
    driver: bridge